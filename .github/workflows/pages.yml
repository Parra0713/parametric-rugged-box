# Publica la app en GitHub Pages cada vez que cambia dist/rugged-box.html.
# La app ya va compilada en el repositorio: aquí solo se copia como index.html.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/rugged-box.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp dist/rugged-box.html _site/index.html
          cp -r docs/*.png _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
