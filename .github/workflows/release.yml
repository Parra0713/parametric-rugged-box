# Crea la release al subir una etiqueta vX.Y.Z, con la app adjunta.
# Las notas salen de docs/releases/vX.Y.Z.md (si no existe, se generan solas).
name: Crear release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/rugged-box.html "rugged-box-${TAG}.html"
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" "rugged-box-${TAG}.html" --title "Rugged Box ${TAG}" --notes-file "docs/releases/${TAG}.md"
          else
            gh release create "$TAG" "rugged-box-${TAG}.html" --title "Rugged Box ${TAG}" --generate-notes
          fi
